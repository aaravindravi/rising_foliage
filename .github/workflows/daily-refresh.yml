name: daily-refresh

on:
  schedule:
    - cron: "0 10 * * *" # 06:00 Toronto, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Refresh satellite + ground evidence
        run: uv run prototype/refresh.py
      - name: Commit new data
        run: |
          git config user.name "foliage-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototype/output/places prototype/output/ground/onparks_history.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new data today."
          fi
